name: Windows and Android builds to Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.zip *.tpz
      - name: Import
        run: ~/godot/godot --headless --path . --import
      - name: Export Windows (Forward+, single exe)
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/Redline.exe
          cd build/windows && zip -q ../Redline-windows.zip Redline.exe
      - name: Android SDK, debug keystore, editor settings
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" > /dev/null
          mkdir -p ~/.android build/android
          "$JAVA/bin/keytool" -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          done
      - name: Export Android (debug APK, arm64)
        run: |
          ~/godot/godot --headless --path . --export-debug "Android" build/android/Redline-android-debug.apk
          ls -l build/android/Redline-android-debug.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/Redline-windows.zip build/android/Redline-android-debug.apk --title "REDLINE (latest main)" --notes "Automatic build of ${GITHUB_SHA::10}. Windows: unzip and run Redline.exe. Android: install Redline-android-debug.apk (allow installs from this source). Controls: WASD move, U/I/J/K attacks, Space block, O throw, F1 help." --prerelease
