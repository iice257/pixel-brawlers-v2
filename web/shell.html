<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#120e14">
		<title>REDLINE</title>
		<style>
@font-face {
	font-family: "Bangers";
	src: url("brand/Bangers.ttf") format("truetype");
	font-display: swap;
}
:root {
	--soot: #120e14;
	--soot-2: #1b1520;
	--brass: #b8883a;
	--brass-hi: #ecc47a;
	--steam: #f3e3c0;
	--dim: #8f7f6b;
	--alert: #d4553f;
	--red: #e3262f;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background: var(--soot);
	color: var(--steam);
	overflow: hidden;
	touch-action: none;
	font-family: "Bahnschrift", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

#canvas {
	display: block;
	background: var(--soot);
}

#canvas:focus {
	outline: none;
}

/* Loader overlay: soot ground, a low brass glow behind the wordmark, one thin progress line. */
#loader {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 0 16px;
	background:
		radial-gradient(60% 45% at 50% 46%, rgba(184, 136, 58, 0.16), rgba(184, 136, 58, 0) 70%),
		linear-gradient(180deg, var(--soot) 0%, var(--soot-2) 100%);
	visibility: hidden;
	opacity: 1;
	transition: opacity 0.5s ease;
	z-index: 2;
}

#loader.fade {
	opacity: 0;
	pointer-events: none;
}

.mark {
	position: relative;
	margin: 0;
	text-align: center;
	font-family: "Bangers", "Impact", "Arial Black", sans-serif;
	font-weight: 400;
	line-height: 0.95;
	text-transform: uppercase;
	letter-spacing: 0.06em;
	font-size: clamp(56px, 15vw, 190px);
	color: var(--steam);
	transform: skewX(-9deg);
	-webkit-text-stroke: 0.045em #000;
	paint-order: stroke fill;
	text-shadow: 0.05em 0.05em 0 var(--red), 0 0 60px rgba(227, 38, 47, 0.22);
	animation: punch 0.55s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

.mark span {
	display: block;
}

.mark .second {
	color: var(--brass-hi);
}

.logo {
	display: none;
	max-width: min(420px, 62vw);
	max-height: 26vh;
	animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.tagline {
	display: none;
	margin: 14px 0 0;
	font-size: 13px;
	letter-spacing: 0.3em;
	text-transform: uppercase;
	color: var(--dim);
}

.rule {
	width: min(520px, 70vw);
	height: 1px;
	margin: clamp(20px, 4vh, 36px) 0 clamp(18px, 3.4vh, 30px);
	background: linear-gradient(90deg, rgba(227, 38, 47, 0), var(--red) 50%, rgba(227, 38, 47, 0));
	transform-origin: center;
	animation: draw 0.9s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

.meter {
	width: min(520px, 70vw);
	animation: fadein 0.6s 0.55s ease both;
}

/* Pressure gauge: tick marks, a red zone at the end, a needle that rides the fill. */
.track {
	position: relative;
	height: 12px;
	background:
		linear-gradient(90deg, transparent 86%, rgba(227, 38, 47, 0.38) 86%),
		repeating-linear-gradient(90deg, rgba(243, 227, 192, 0.5) 0 1px, transparent 1px 5%),
		rgba(243, 227, 192, 0.08);
	border: 1px solid rgba(243, 227, 192, 0.28);
}

#fill {
	position: absolute;
	inset: 0;
	clip-path: inset(0 100% 0 0);
	background: linear-gradient(90deg, var(--brass) 0%, var(--brass-hi) 60%, var(--red) 86%, var(--red) 100%);
	transition: clip-path 0.25s linear;
}

#needle {
	position: absolute;
	top: -9px;
	bottom: -9px;
	left: 0;
	width: 3px;
	margin-left: -1px;
	background: var(--red);
	box-shadow: 0 0 10px var(--red);
	transition: left 0.25s linear;
}

.track.indeterminate #needle {
	display: none;
}

.track.indeterminate #fill {
	width: 35%;
	clip-path: none;
	animation: slide 1.3s ease-in-out infinite;
}

.readout {
	display: flex;
	justify-content: space-between;
	margin-top: 12px;
	font-size: 12px;
	letter-spacing: 0.16em;
	text-transform: uppercase;
	color: var(--dim);
	font-variant-numeric: tabular-nums;
}

#notice {
	display: none;
	max-width: min(520px, 86vw);
	margin-top: 28px;
	padding: 14px 18px;
	border: 1px solid var(--alert);
	background: rgba(212, 85, 63, 0.1);
	color: var(--steam);
	font-size: 14px;
	line-height: 1.45;
	text-align: center;
}

@keyframes punch { from { opacity: 0; transform: skewX(-9deg) scale(1.35); } to { opacity: 1; transform: skewX(-9deg) scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

@media (prefers-reduced-motion: reduce) {
	.mark, .logo, .rule, .meter { animation: none; }
	#loader { transition: none; }
	#fill { transition: none; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="loader" role="status" aria-live="polite">
			<img class="logo" id="logo" alt="">
			<h1 class="mark" id="mark"><span>REDLINE</span></h1>
			<p class="tagline" id="tagline"></p>
			<div class="rule"></div>
			<div class="meter">
				<div class="track indeterminate" id="track"><div id="fill"></div><div id="needle"></div></div>
				<div class="readout"><span id="phase">Connecting</span><span id="amount">0%</span></div>
			</div>
			<div id="notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// Our own cache worker (pb.service.worker.js) is registered once the game is running; stop the engine installing Godot's stock one.
const CACHE_WORKER = 'pb.service.worker.js';
GODOT_CONFIG['serviceWorker'] = '';
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const track = document.getElementById('track');
	const fill = document.getElementById('fill');
	const needle = document.getElementById('needle');
	const phase = document.getElementById('phase');
	const amount = document.getElementById('amount');
	const notice = document.getElementById('notice');

	let initializing = true;
	let shown = false;

	// web/brand.json is optional: name, tagline, logo and colours come from it, the text wordmark is the fallback.
	const VARS = { soot: '--soot', soot2: '--soot-2', red: '--red', brass: '--brass', brassHi: '--brass-hi', steam: '--steam' };
	fetch('brand.json', { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).then((brand) => {
		if (!brand) {
			return;
		}
		const colors = brand.colors || {};
		for (const key in VARS) {
			if (/^#[0-9a-f]{3,8}$/i.test(colors[key] || '')) {
				document.documentElement.style.setProperty(VARS[key], colors[key]);
			}
		}
		const name = Array.isArray(brand.name) ? brand.name.slice(0, 2) : [];
		if (name.length) {
			const mark = document.getElementById('mark');
			mark.textContent = '';
			name.forEach((word, i) => {
				const span = document.createElement('span');
				span.textContent = String(word);
				if (i === 1) {
					span.className = 'second';
				}
				mark.appendChild(span);
			});
			document.title = name.join(' ');
		}
		if (brand.tagline) {
			const tag = document.getElementById('tagline');
			tag.textContent = String(brand.tagline);
			tag.style.display = 'block';
		}
		if (brand.logo) {
			const logo = document.getElementById('logo');
			logo.onload = () => {
				logo.style.display = 'block';
				document.getElementById('mark').style.display = 'none';
			};
			logo.src = brand.logo;
		}
	}).catch(() => {});

	function show() {
		if (shown) {
			return;
		}
		shown = true;
		loader.style.visibility = 'visible';
	}

	function done() {
		if (!initializing) {
			return;
		}
		initializing = false;
		loader.classList.add('fade');
		setTimeout(() => loader.remove(), 600);
		if ('serviceWorker' in navigator && location.protocol !== 'file:') {
			navigator.serviceWorker.register(CACHE_WORKER).catch((err) => console.warn('Cache worker not registered:', err));
		}
	}

	function fail(message) {
		show();
		track.classList.remove('indeterminate');
		fill.style.clipPath = 'inset(0 100% 0 0)';
		phase.textContent = 'Stalled';
		amount.textContent = '';
		notice.style.display = 'block';
		notice.textContent = message;
		initializing = false;
	}

	function displayFailureNotice(err) {
		console.error(err);
		fail(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.'));
	}

	function megabytes(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			const pct = Math.min(current / total, 1);
			track.classList.remove('indeterminate');
			fill.style.clipPath = 'inset(0 ' + ((1 - pct) * 100) + '% 0 0)';
			needle.style.left = (pct * 100) + '%';
			phase.textContent = pct < 0.35 ? 'Firing the boiler' : (pct < 0.9 ? 'Building pressure' : 'Into the red');
			amount.textContent = Math.floor(pct * 100) + '%  ·  ' + megabytes(current) + ' / ' + megabytes(total) + ' MB';
		} else {
			track.classList.add('indeterminate');
			phase.textContent = 'Connecting';
			amount.textContent = '';
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			fail('This browser is missing features the game needs:\n' + missing.join('\n'));
		}
	} else {
		show();
		engine.startGame({ 'onProgress': onProgress }).then(done, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
